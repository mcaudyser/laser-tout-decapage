[build]
  publish = "."

[[redirects]]
  from = "https://lasertoutdecapage.com/*"
  to = "https://lasertoutdecapage.fr/:splat"
  status = 301
  force = true

[[redirects]]
  from = "https://www.lasertoutdecapage.com/*"
  to = "https://lasertoutdecapage.fr/:splat"
  status = 301
  force = true

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
